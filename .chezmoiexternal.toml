# Third-party shell frameworks/plugins, cloned on first apply and pulled
# weekly afterwards (`chezmoi apply --refresh-externals` forces a pull).
# Nothing here lives inside a source-managed directory: chezmoi refuses to
# own files inside a git-repo external, which is why ZSH_CUSTOM sits in
# ~/.config/zsh/custom instead of ~/.oh-my-zsh/custom.

[".oh-my-zsh"]
    type = "git-repo"
    url = "https://github.com/ohmyzsh/ohmyzsh.git"
    refreshPeriod = "168h"
    clone.args = ["--depth", "1"]

# ── Theme ─────────────────────────────────────────────────────────────────────
[".config/zsh/custom/themes/powerlevel10k"]
    type = "git-repo"
    url = "https://github.com/romkatv/powerlevel10k.git"
    refreshPeriod = "168h"
    clone.args = ["--depth", "1"]

